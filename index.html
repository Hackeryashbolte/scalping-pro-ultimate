<button class="btn-success" onclick="openTrade('BUY')">
    <i class="fas fa-arrow-up"></i> BUY

<!-- SELL BUTTON -->
<button class="btn-danger" onclick="openTrade('SELL')">
    <i class="fas fa-arrow-down"></i> SELL
</button>

<script>

// =====================================================
// FIXED TRADE LOGIC
// =====================================================

function calculateTradeSetup(cur) {

    const pair = ALL_PAIRS[selectedPair];
    const ind = calculateIndicators();

    let tradeSide = 'WAIT';

    const strongBuy =
        ind.emaSignal === 'BUY' &&
        ind.macdSignal === 'BULLISH' &&
        ind.rsi > 45 &&
        ind.rsi < 70;

    const strongSell =
        ind.emaSignal === 'SELL' &&
        ind.macdSignal === 'BEARISH' &&
        ind.rsi > 30 &&
        ind.rsi < 55;

    if (strongBuy) {
        tradeSide = 'STRONG BUY';
    }

    else if (strongSell) {
        tradeSide = 'STRONG SELL';
    }

    else {
        tradeSide = 'WAIT';
    }

    document.getElementById('entryType').textContent = tradeSide;

    const entry = cur;

    // FIXED 600 PIP STOP LOSS
    const fixedPips = 600;

    const risk = pair.pip * fixedPips;

    let sl, t1, t2, t3, hold;

    // =========================
    // SELL LOGIC FIXED
    // =========================
    if (tradeSide.includes('SELL')) {

        sl = entry + risk;

        t1 = entry - risk;
        t2 = entry - risk * 2;
        t3 = entry - risk * 3;
        hold = entry - risk * 4;
    }

    // =========================
    // BUY LOGIC FIXED
    // =========================
    else {

        sl = entry - risk;

        t1 = entry + risk;
        t2 = entry + risk * 2;
        t3 = entry + risk * 3;
        hold = entry + risk * 4;
    }

    const fmt = v => v.toFixed(pair.decimals);

    document.getElementById('entryPrice').textContent = fmt(entry);
    document.getElementById('slPrice').textContent = fmt(sl);

    document.getElementById('t1Price').textContent = fmt(t1);
    document.getElementById('t2Price').textContent = fmt(t2);
    document.getElementById('t3Price').textContent = fmt(t3);

    document.getElementById('holdPrice').textContent = fmt(hold);

    document.getElementById('riskAmount').textContent =
        fixedPips + ' pips';

    document.getElementById('rrRatio').textContent = '1:4';

    document.getElementById('winProb').textContent =
        tradeSide === 'WAIT'
        ? 'NO TRADE'
        : '78-85%';
}


// =====================================================
// FIXED OPEN TRADE FUNCTION
// =====================================================

function openTrade(side) {

    const pair = ALL_PAIRS[selectedPair];

    const price = pair.price.toFixed(pair.decimals);

    if (side === 'BUY') {

        showToast(
            '🟢 BUY ORDER: ' +
            pair.symbol +
            ' @ ' +
            price,
            'success'
        );

        addTerminalLog(
            '[BUY] ' +
            pair.symbol +
            ' @ ' +
            price,
            'buy'
        );
    }

    else {

        showToast(
            '🔴 SELL ORDER: ' +
            pair.symbol +
            ' @ ' +
            price,
            'danger'
        );

        addTerminalLog(
            '[SELL] ' +
            pair.symbol +
            ' @ ' +
            price,
            'sell'
        );
    }
}

</script>
